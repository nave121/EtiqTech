name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"   # the interpreter the image ships (Dockerfile FROM)

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          PYTHONPATH=. python -m pytest tests/ -x -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"   # the interpreter the image ships (Dockerfile FROM)

      - name: Install dependencies
        run: pip install -r requirements.txt bandit

      - name: Bandit security scan
        run: bandit -r src/ server/ -f json -o bandit-report.json --exit-zero

      - name: Upload Bandit report
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Bandit gate (medium+ severity fails the build)
        run: bandit -r src/ server/ -ll -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"   # the interpreter the image ships (Dockerfile FROM)

      - name: pip-audit pinned dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict --progress-spinner off

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t etiqtech:ci .

      - name: Run image and assert the law corpus is inside it
        run: |
          docker run -d --name etiqtech -p 4242:4242 etiqtech:ci
          for i in $(seq 1 30); do
            if curl -fs localhost:4242/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fs localhost:4242/api/health | tee health.json
          python3 -c "import json; h=json.load(open('health.json')); assert h['law_loaded'] is True, h"
          if docker logs etiqtech 2>&1 | grep -q "LAW TEXT NOT FOUND"; then
            echo 'law warning present in container logs'; exit 1
          fi
          docker rm -f etiqtech

  publish:
    # Push the image Argo CD deploys. Only on main, only after tests, security, audit and the
    # image check pass. Tags: sha-<short> (pin this in k8s/overlays/prod-remote) and main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, security, audit, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU (arm64 build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN works once the repository may write packages. If GHCR keeps answering
          # permission_denied: write_package, create a classic PAT with write:packages and store it
          # as the repository secret GHCR_TOKEN; it takes precedence here.
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/etiqtech
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
