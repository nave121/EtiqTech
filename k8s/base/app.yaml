apiVersion: apps/v1
kind: Deployment
metadata:
  name: etiqtech
  labels:
    app: etiqtech
spec:
  replicas: 1
  selector:
    matchLabels:
      app: etiqtech
  template:
    metadata:
      labels:
        app: etiqtech
    spec:
      serviceAccountName: etiqtech
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: etiqtech
          image: etiqtech:local  # Replace with your registry image
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 4242
          env:
            # LOCAL-FIRST DEFAULT: the in-cluster Ollama service (k8s/ollama-local.yaml).
            # Protocol text never leaves the cluster. The NetworkPolicy only allows
            # egress to pods labelled app=ollama, so a public URL here would not even
            # connect — and the app refuses non-local hosts unless
            # ETIQTECH_ALLOW_REMOTE_LLM=1 is set. See k8s/overlays/remote-llm/ for
            # the explicit, opt-in cloud variant and what it implies.
            - name: OLLAMA_BASE_URL
              value: "http://ollama:11434"
            - name: OLLAMA_MODEL
              value: "qwen3.5:35b"
            # Behind Cloudflare Access / an ingress that sets X-Forwarded-For:
            # - name: ALLOWED_ORIGINS        # required with PROXY_FIX: the public origin, e.g. https://etiq.example.org
            #   value: "https://etiq.example.org"
            # - name: PROXY_FIX
            #   value: "1"
            - name: OLLAMA_NUM_CTX
              value: "32768"
            - name: LLM_TEMPERATURE
              value: "0.2"
            - name: LLM_MAX_TOKENS
              value: "8192"
            - name: OLLAMA_TIMEOUT_SECONDS
              value: "300"
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-output
              mountPath: /app/output
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4242
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4242
            initialDelaySeconds: 5
            periodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
        - name: app-output
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: etiqtech
spec:
  selector:
    app: etiqtech
  ports:
    - port: 80
      targetPort: 4242
