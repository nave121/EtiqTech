apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Base: the app, its ServiceAccount and the local-first NetworkPolicy. On its own it expects an
# in-cluster Ollama at http://ollama:11434 (overlays/local-ollama adds one). Nothing here sends
# protocol text off-cluster.
resources:
  - rbac.yaml
  - network-policy.yaml
  - app.yaml
