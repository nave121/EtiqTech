apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ethicchecker-netpolicy
spec:
  podSelector:
    matchLabels:
      app: ethicchecker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 4242
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: ollama
      ports:
        - protocol: TCP
          port: 11434
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
