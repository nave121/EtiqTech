# NOT applied by kustomize and NOT to be committed with values. Create the two Secrets out of band:
#
#   kubectl -n etiqtech create secret generic etiqtech-app \
#     --from-literal=SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
#   kubectl -n etiqtech create secret generic etiqtech-llm \
#     --from-literal=ANTHROPIC_API_KEY='sk-ant-...'          # or OPENAI_API_KEY='sk-...'
#
# Or feed this shape to External Secrets / Sealed Secrets. Keys must match deployment-patch.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: etiqtech-app
  namespace: etiqtech
type: Opaque
stringData:
  SECRET_KEY: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: etiqtech-llm
  namespace: etiqtech
type: Opaque
stringData:
  ANTHROPIC_API_KEY: REPLACE_ME
  # OPENAI_API_KEY: REPLACE_ME
